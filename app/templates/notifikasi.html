{% extends "base.html" %}
{% block title %}Notifikasi{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="fw-bold">Notifikasi</h2>
  <form method="post" action="{{ url_for('notifikasi.baca_semua') }}"><button class="btn btn-sm btn-outline-dark">Tandai semua dibaca</button></form>
</div>
{% for n in items %}
<div class="card mb-2 {% if not n.dibaca %}border-primary{% endif %}"><div class="card-body d-flex justify-content-between">
  <div><b>{{ n.judul }}</b><div class="small text-muted">{{ n.created_at }}</div><div>{{ n.pesan }}</div></div>
  {% if not n.dibaca %}<form method="post" action="{{ url_for('notifikasi.baca', nid=n.id) }}"><button class="btn btn-sm btn-primary">Tandai dibaca</button></form>{% endif %}
</div></div>
{% else %}<p class="text-muted">Tidak ada notifikasi.</p>{% endfor %}
{% endblock %}
