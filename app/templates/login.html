{% extends "base.html" %}
{% block title %}Masuk{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center py-4 py-md-5">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0 p-3 p-md-4">
      <div class="card-body">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 64px; height: 64px; background: var(--caramel-100); color: var(--coffee-700); font-size: 2rem;">
            ☕
          </div>
          <h3 class="fw-bold mb-1">KMS Kopi</h3>
          <p class="text-muted small">Knowledge Management System Kedai Kopi</p>
        </div>

        <form method="post" id="loginForm">
          <div class="mb-3">
            <label class="form-label">Nama Pengguna (opsional)</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
              <input name="nama" id="inputNama" class="form-control border-start-0 ps-0" placeholder="cth: Pemilik / Barista">
            </div>
          </div>
          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label mb-0">PIN Akses</label>
              <span class="text-muted" style="font-size: 0.75rem;">4 Digit Angka</span>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-key"></i></span>
              <input name="pin" id="inputPin" type="password" inputmode="numeric" maxlength="6" class="form-control border-start-0 ps-0 form-control-lg fw-bold" placeholder="••••" required autofocus style="letter-spacing: 0.25em;">
            </div>
          </div>
          <button type="submit" class="btn btn-dark w-100 btn-lg shadow-sm mb-3">
            <span>Masuk ke Sistem</span>
            <i class="bi bi-arrow-right ms-1"></i>
          </button>
        </form>

        <div class="border-top pt-3 mt-2">
          <p class="text-muted small text-center mb-2">Akun Demo Cepat:</p>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary w-50" onclick="isiDemo('Pemilik', '1111')">
              <i class="bi bi-shield-lock me-1"></i> Pemilik (1111)
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary w-50" onclick="isiDemo('Karyawan', '2222')">
              <i class="bi bi-cup-hot me-1"></i> Barista (2222)
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function isiDemo(nama, pin) {
  document.getElementById('inputNama').value = nama;
  document.getElementById('inputPin').value = pin;
}
</script>
{% endblock %}
