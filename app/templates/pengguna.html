{% extends "base.html" %}
{% block title %}Pengguna{% endblock %}
{% block content %}
<h2 class="fw-bold mb-3">Kelola Pengguna</h2>
<div class="row g-3">
<div class="col-md-7"><div class="card"><table class="table mb-0"><thead><tr><th>Nama</th><th>Peran</th><th>Status</th><th></th></tr></thead><tbody>
{% for u in users %}<tr><td>{{ u.nama }}</td><td>{{ u.peran }}</td><td>{{ 'Aktif' if u.aktif else 'Nonaktif' }}</td>
<td><form method="post" action="{{ url_for('auth.toggle', user_id=u.id) }}"><button class="btn btn-sm btn-outline-secondary">Toggle</button></form></td></tr>{% endfor %}
</tbody></table></div></div>
<div class="col-md-5"><div class="card card-body"><h5 class="fw-bold">Tambah</h5>
<form method="post" action="{{ url_for('auth.tambah') }}">
  <input name="nama" class="form-control mb-2" placeholder="Nama" required>
  <select name="peran" class="form-select mb-2"><option value="karyawan">karyawan</option><option value="pemilik">pemilik</option></select>
  <input name="pin" class="form-control mb-2" placeholder="PIN" required>
  <button class="btn btn-dark w-100">Tambah</button>
</form></div></div>
</div>
{% endblock %}
